<!DOCTYPE html>
<html lang="it">
<head>
<script>window.onerror=function(m,s,l){document.body&&document.body.insertAdjacentHTML('afterbegin','<pre style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#400;color:#fff;font-size:11px;padding:6px;max-height:40vh;overflow:auto;white-space:pre-wrap">ERRORE: '+m+' (riga '+l+')</pre>')};window.onunhandledrejection=function(e){var r=e.reason;document.body&&document.body.insertAdjacentHTML('afterbegin','<pre style="position:fixed;top:0;left:0;right:0;z-index:99999;background:#024;color:#fff;font-size:11px;padding:6px;max-height:40vh;overflow:auto;white-space:pre-wrap">PROMESSA: '+(r&&r.message||r)+'</pre>')};</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>ForfettarioApp · Peppone Tek</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--s1:#161b22;--s2:#1c2330;
  --bd:#2a3140;--bd2:#374151;
  --t1:#e6edf3;--t2:#8b949e;--t3:#6e7681;
  --ac:#58a6ff;--ac2:#1f6feb;
  --gr:#3fb950;--gr-d:#1e3a2a;--gr-b:#238636;
  --ye:#d29922;--ye-d:#2e2414;--ye-b:#9e6a03;
  --re:#f85149;--re-d:#3a1a1a;--re-b:#8b1a1a;
  --pu:#bc8cff;--pu-d:rgba(188,140,255,.08);--pu-b:#6e40c9;
  --r:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  font-size:15px;min-height:100vh;overflow-x:hidden;
  background-image:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(31,111,235,.12),transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%,rgba(63,185,80,.06),transparent);}

/* LOADING GUARD — mostrato durante il check sessione all'avvio */
#loading-screen{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .3s ease;
}
html.has-session #loading-screen{display:flex}
html.has-session #auth-screen{display:none!important}
#loading-screen.hidden{opacity:0;pointer-events:none;visibility:hidden}
#loading-screen.gone{display:none}
#loading-screen .ls-ico{font-size:48px;animation:lsPulse 1.5s ease-in-out infinite}
