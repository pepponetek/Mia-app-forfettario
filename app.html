<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1117">
<title>ForfettarioApp · Peppone Tek</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
/* --- CSS CORE & REATTIVITÀ MOBILE --- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0d1117;--s1:#161b22;--s2:#1c2330;
  --bd:#2a3140;--bd2:#374151;
  --t1:#e6edf3;--t2:#8b949e;--t3:#6e7681;
  --ac:#58a6ff;--ac2:#1f6feb;
  --gr:#3fb950;--gr-d:#1e3a2a;--gr-b:#238636;
  --ye:#d29922;--ye-d:#2e2414;--ye-b:#9e6a03;
  --re:#f85149;--re-d:#3a1a1a;--re-b:#8b1a1a;
  --r:10px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
}
body{background:var(--bg);color:var(--t1);font-family:-apple-system,system-ui,sans-serif;font-size:15px;min-height:100vh;overflow-x:hidden}

/* SIDEBAR & NAV */
.sidebar{width:240px;position:fixed;top:0;left:0;bottom:0;background:var(--s1);border-right:1px solid var(--bd);z-index:200;display:flex;flex-direction:column}
.content{margin-left:240px;padding:24px 22px 80px;flex:1}
@media(max-width:768px){
    .sidebar{display:none}
    .content{margin-left:0;padding:15px 15px 100px}
}

/* DASHBOARD CARDS */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:15px}
.sg{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;margin-bottom:15px}
.sc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:15px}
.sc .sl{font-size:11px;color:var(--t3);text-transform:uppercase;font-weight:700}
.sc .sv{font-size:18px;font-weight:800;font-family:monospace;margin-top:4px}

/* DOCUMENTI TAB */
.doc-item{display:flex;align-items:center;justify-content:space-between;background:var(--s2);padding:12px;border-radius:8px;margin-bottom:8px;border:1px solid var(--bd)}
.doc-info{display:flex;align-items:center;gap:12px}
.doc-ico{font-size:24px}
.doc-name{font-weight:600;font-size:14px}
.doc-meta{font-size:11px;color:var(--t3)}

/* TOAST & LOADER */
#toasts{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:10px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
.toast-ok{background:var(--gr-d);color:var(--gr);border:1px solid var(--gr-b)}
.toast-err{background:var(--re-d);color:var(--re);border:1px solid var(--re-b)}

/* HELPERS */
.hidden{display:none!important}
.flex-col{display:flex;flex-direction:column}
</style>
</head>
<body>

<div id="app" class="show">
    <div class="sidebar">
        <div style="padding:20px; border-bottom:1px solid var(--bd)">
            <h2>ForfettarioApp</h2>
            <p style="font-size:11px; color:var(--t3)">Smart Tax Engine</p>
        </div>
        <nav style="padding:10px">
            <div class="nav-btn active" onclick="showView('dashboard')">📊 Dashboard</div>
            <div class="nav-btn" onclick="showView('documenti')">📁 Documenti PDF</div>
            <div class="nav-btn" onclick="showView('calcolo')">➕ Nuovo Calcolo</div>
        </nav>
    </div>

    <div class="content">
        <div id="view-dashboard" class="view active">
            <div class="ph">
                <h1>Dashboard Fiscale</h1>
                <p id="dash-year-label">Riepilogo anno 2024</p>
            </div>
            
            <div class="sg">
                <div class="sc ac">
                    <div class="sl">Fatturato Lordo</div>
                    <div id="dash-fatturato" class="sv">€ 0,00</div>
                </div>
                <div class="sc pc">
                    <div class="sl">Contributi INPS</div>
                    <div id="dash-inps" class="sv">€ 0,00</div>
                </div>
                <div class="sc rc">
                    <div class="sl">Imposta Sost.</div>
                    <div id="dash-imposta" class="sv">€ 0,00</div>
                </div>
            </div>

            <div class="card">
                <h3>Carica Documento (RPF o F24)</h3>
                <p style="font-size:12px; color:var(--t2); margin-bottom:15px">Il sistema estrarrà automaticamente i dati LM22, LM35 e LM39.</p>
                <input type="file" id="pdf-upload" accept=".pdf" style="display:none" onchange="handleFileUpload(this)">
                <button class="btn btn-full" onclick="document.getElementById('pdf-upload').click()">🚀 Seleziona PDF</button>
            </div>
        </div>

        <div id="view-documenti" class="view hidden">
            <div class="ph">
                <h1>I Tuoi Documenti</h1>
                <input type="text" id="doc-search" placeholder="Cerca per nome o anno..." class="adm-search" oninput="renderDocumenti()">
            </div>
            <div id="docs-list">
                </div>
        </div>
    </div>
</div>

<div id="toasts"></div>

<script>
/* --- CONFIGURAZIONE & LOGICA CORE --- */
const pdfjsLib = window['pdfjs-dist/build/pdf'];
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let _user = null;
let _anniData = {}; // Archivio dati da Supabase

// 1. FUNZIONE DI PRE-PARSING LOCALE (DETERMINISTICA)
async function tryParseRPFLocally(text) {
    const isRPF = text.includes("PERSONE FISICHE") && text.includes("QUADRO LM");
    if (!isRPF) return null;

    console.log("Rilevato Modello Redditi - Avvio estrazione locale...");
    const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    
    // Trova l'ATECO (6 cifre isolate)
    const atecoIdx = lines.findIndex(l => /^\d{6}$/.test(l));
    if (atecoIdx === -1) return null;

    // Estrai i numeri con punto (formato 34.827)
    const values = [];
    for (let i = atecoIdx; i < atecoIdx + 60; i++) {
        if (lines[i] && lines[i].includes('.') && /^[0-9.]+$/.test(lines[i])) {
            const val = parseFloat(lines[i].replace(/\./g, ''));
            if (!isNaN(val) && val > 100) values.push(val);
        }
    }

    // Mapping logico basato sulla struttura fiscale
    return {
        tipo: 'RPF',
        fatturato: values[0] || 0,   // LM22
        contributi: values[2] || 0,  // LM35
        imposta: values[values.length - 1] || 0, // LM39 (solitamente l'ultimo valore numerico del quadro)
        anno: 2024 // Basato sull'esempio RPF25
    };
}

// 2. GESTIONE CARICAMENTO PDF
async function handleFileUpload(input) {
    const file = input.files[0];
    if (!file) return;

    toast("⏳ Analisi PDF in corso...", "info");

    try {
        const text = await extractTextFromPDF(file);
        const localData = await tryParseRPFLocally(text);

        if (localData) {
            await saveDataWithCascade(localData.anno, localData);
            toast("✅ Dichiarazione RPF caricata correttamente!", "ok");
        } else {
            // Se fallisce il parsing locale, potresti integrare Gemini qui
            toast("⚠️ Formato non riconosciuto. Inserisci i dati manualmente.", "err");
        }
    } catch (e) {
        toast("❌ Errore durante l'elaborazione", "err");
        console.error(e);
    }
}

// 3. LOGICA DI PROPAGAZIONE (CASCADE)
async function saveDataWithCascade(year, data) {
    // Salvataggio Anno Corrente
    const updates = {
        fatturato: data.fatturato,
        contributi_inps: data.contributi,
        imposta_sost: data.imposta,
        updated_at: new Date().toISOString()
    };

    // Salvataggio nel database (Esempio Supabase)
    // await sb.from('anni_fiscali').upsert({ id: `user_id_${year}`, ...updates });

    // PROPAGAZIONE: Calcola acconti per l'anno successivo (Year + 1)
    if (data.imposta > 0) {
        const nextYear = year + 1;
        const acconti = {
            acconto_1: data.imposta * 0.40,
            acconto_2: data.imposta * 0.60,
            acconto_note: `Generato da imposta ${year}`
        };
        console.log(`Propagazione acconti al ${nextYear}:`, acconti);
        // await sb.from('anni_fiscali').upsert({ id: `user_id_${nextYear}`, ...acconti });
    }

    refreshDashboard();
}

// 4. ESTRAZIONE TESTO PDF.JS
async function extractTextFromPDF(file) {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
    let fullText = "";
    for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        fullText += content.items.map(item => item.str).join('\n') + '\n';
    }
    return fullText;
}

// 5. RENDERING DOCUMENTI (Con Ricerca)
function renderDocumenti() {
    const list = document.getElementById('docs-list');
    const search = document.getElementById('doc-search').value.toLowerCase();
    
    // Esempio dati
    const mockDocs = [
        { name: "Dichiarazione_2024.pdf", type: "RPF", date: "20/02/2025" },
        { name: "F24_Giugno.pdf", type: "F24", date: "15/06/2024" }
    ];

    list.innerHTML = mockDocs
        .filter(d => d.name.toLowerCase().includes(search))
        .map(d => `
            <div class="doc-item">
                <div class="doc-info">
                    <span class="doc-ico">📄</span>
                    <div>
                        <div class="doc-name">${d.name}</div>
                        <div class="doc-meta">${d.type} • Caricato il ${d.date}</div>
                    </div>
                </div>
                <button class="btn btn-xs btn-re" onclick="deleteDoc('${d.name}')">Elimina</button>
            </div>
        `).join('');
}

// 6. UTILS UI
function showView(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById('view-' + viewId).classList.remove('hidden');
    if (viewId === 'documenti') renderDocumenti();
}

function toast(msg, type) {
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => t.remove(), 4000);
}

function refreshDashboard() {
    // Inserire qui la logica per aggiornare i numeri della dashboard dai dati Supabase
    console.log("Dashboard aggiornata.");
}
</script>
</body>
</html>
