<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 100" width="480" height="100">
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#3fb950"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sfondo trasparente (nessun rect) -->

  <!-- ===== ICONA SCONTRINO COMPATTA ===== -->
  <g transform="translate(14, 10)">
    <!-- Corpo scontrino -->
    <rect x="0" y="0" width="56" height="74" rx="7"
          fill="#161b22" stroke="url(#accentGrad)" stroke-width="1.5"/>

    <!-- Zigzag fondo -->
    <path d="M0 56 L7 63 L14 56 L21 63 L28 56 L35 63 L42 56 L49 63 L56 58 L56 74 L0 74 Z"
          fill="#0d1117"/>
    <path d="M0 56 L7 63 L14 56 L21 63 L28 56 L35 63 L42 56 L49 63 L56 58"
          fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Riga titolo -->
    <rect x="10" y="10" width="36" height="5" rx="2.5" fill="url(#accentGrad)" opacity="0.9"/>
    <!-- Divisore -->
    <line x1="6" y1="21" x2="50" y2="21" stroke="#2a3140" stroke-width="0.8"/>

    <!-- Righe dati -->
    <rect x="10" y="27" width="20" height="3.5" rx="1.75" fill="#8b949e" opacity="0.5"/>
    <rect x="36" y="27" width="12" height="3.5" rx="1.75" fill="#3fb950" opacity="0.8"/>

    <rect x="10" y="34" width="18" height="3.5" rx="1.75" fill="#8b949e" opacity="0.5"/>
    <rect x="36" y="34" width="13" height="3.5" rx="1.75" fill="#f85149" opacity="0.7"/>

    <!-- Divisore totale -->
    <line x1="6" y1="43" x2="50" y2="43" stroke="#2a3140" stroke-width="0.8"/>

    <!-- Totale evidenziato -->
    <rect x="10" y="47" width="16" height="4.5" rx="2.25" fill="#8b949e" opacity="0.6"/>
    <rect x="32" y="46.5" width="18" height="5.5" rx="2.75" fill="url(#accentGrad)" opacity="1"/>

    <!-- Punto in alto destra -->
    <circle cx="50" cy="7" r="3.5" fill="url(#accentGrad)" opacity="0.9"/>
  </g>

  <!-- ===== TESTO ===== -->
  <!-- "Forfettario" -->
  <text x="86" y="52"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, sans-serif"
        font-size="34" font-weight="800"
        letter-spacing="-1"
        fill="url(#accentGrad)"
        filter="url(#softGlow)">Forfettario</text>

  <!-- "App" -->
  <text x="346" y="52"
        font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, sans-serif"
        font-size="34" font-weight="800"
        letter-spacing="-1"
        fill="#e6edf3">App</text>

  <!-- "by Peppone Tek" -->
  <text x="86" y="72"
        font-family="'Courier New', monospace"
        font-size="11" font-weight="400"
        letter-spacing="2.5"
        fill="#6e7681">BY PEPPONE TEK</text>

  <!-- Lineetta decorativa -->
  <line x1="86" y1="79" x2="410" y2="79" stroke="url(#accentGrad)" stroke-width="0.8" opacity="0.25"/>

  <!-- Tre dot tech -->
  <circle cx="86" cy="89" r="2.5" fill="#58a6ff" opacity="0.5"/>
  <circle cx="95" cy="89" r="2.5" fill="url(#accentGrad)" opacity="0.7"/>
  <circle cx="104" cy="89" r="2.5" fill="#3fb950" opacity="0.5"/>
</svg>
