<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="400"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"></stop>
      <stop offset="100%" style="stop-color:#161b22"></stop>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff"></stop>
      <stop offset="100%" style="stop-color:#3fb950"></stop>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#3fb950;stop-opacity:1"></stop>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f6feb;stop-opacity:0.3"></stop>
      <stop offset="100%" style="stop-color:#238636;stop-opacity:0.15"></stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="coloredBlur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>
    <clipPath id="roundedClip">
      <rect width="400" height="400" rx="80" ry="80"></rect>
    </clipPath>
  </defs>

  <!-- Sfondo con clip arrotondato -->
  <g clip-path="url(#roundedClip)">
    <!-- Sfondo base -->
    <rect width="400" height="400" fill="url(#bgGrad)"></rect>

    <!-- Glow blob in alto a sinistra -->
    <ellipse cx="80" cy="80" rx="120" ry="100" fill="url(#glowGrad)" opacity="0.6"></ellipse>
    <!-- Glow blob in basso a destra -->
    <ellipse cx="330" cy="340" rx="100" ry="90" fill="#238636" opacity="0.08"></ellipse>

    <!-- Bordo sottile -->
    <rect width="400" height="400" rx="80" ry="80" fill="none" stroke="#2a3140" stroke-width="1.5"></rect>

    <!-- Griglia di sfondo (dettaglio tech) -->
    <g opacity="0.04" stroke="#58a6ff" stroke-width="0.8">
      <line x1="0" y1="80" x2="400" y2="80"></line>
      <line x1="0" y1="160" x2="400" y2="160"></line>
      <line x1="0" y1="240" x2="400" y2="240"></line>
      <line x1="0" y1="320" x2="400" y2="320"></line>
      <line x1="80" y1="0" x2="80" y2="400"></line>
      <line x1="160" y1="0" x2="160" y2="400"></line>
      <line x1="240" y1="0" x2="240" y2="400"></line>
      <line x1="320" y1="0" x2="320" y2="400"></line>
    </g>

    <!-- ===== ICONA SCONTRINO STILIZZATO ===== -->
    <!-- Corpo scontrino con bordi arrotondati -->
    <g filter="url(#glow)" transform="translate(200, 168)">
      <!-- Ombra/glow dietro -->
      <rect x="-58" y="-88" width="116" height="152" rx="12" fill="url(#iconGrad)" opacity="0.15"></rect>
    </g>

    <!-- Scontrino principale -->
    <rect x="142" y="80" width="116" height="152" rx="12" fill="#161b22" stroke="url(#accentGrad)" stroke-width="1.8"></rect>

    <!-- Zigzag in fondo allo scontrino -->
    <path d="M142 210 L154 222 L166 210 L178 222 L190 210 L202 222 L214 210 L226 222 L238 210 L250 222 L258 218 L258 232 L142 232 Z" fill="#0d1117"></path>
    <path d="M142 210 L154 222 L166 210 L178 222 L190 210 L202 222 L214 210 L226 222 L238 210 L250 222 L258 218" fill="none" stroke="url(#accentGrad)" stroke-width="1.8" stroke-linejoin="round"></path>

    <!-- Linee testo scontrino -->
    <!-- Riga titolo -->
    <rect x="162" y="100" width="76" height="7" rx="3.5" fill="url(#accentGrad)" opacity="0.9"></rect>
    <!-- Divisore -->
    <line x1="155" y1="116" x2="245" y2="116" stroke="#2a3140" stroke-width="1"></line>

    <!-- Righe dati -->
    <rect x="162" y="125" width="45" height="5" rx="2.5" fill="#8b949e" opacity="0.5"></rect>
    <rect x="218" y="125" width="24" height="5" rx="2.5" fill="#3fb950" opacity="0.8"></rect>

    <rect x="162" y="138" width="40" height="5" rx="2.5" fill="#8b949e" opacity="0.5"></rect>
    <rect x="218" y="138" width="28" height="5" rx="2.5" fill="#f85149" opacity="0.7"></rect>

    <rect x="162" y="151" width="50" height="5" rx="2.5" fill="#8b949e" opacity="0.5"></rect>
    <rect x="218" y="151" width="22" height="5" rx="2.5" fill="#d29922" opacity="0.7"></rect>

    <!-- Divisore totale -->
    <line x1="155" y1="164" x2="245" y2="164" stroke="#2a3140" stroke-width="1"></line>

    <!-- Riga totale evidenziata -->
    <rect x="162" y="173" width="35" height="6" rx="3" fill="#8b949e" opacity="0.6"></rect>
    <rect x="210" y="172" width="36" height="8" rx="4" fill="url(#accentGrad)" opacity="1" filter="url(#softGlow)"></rect>

    <!-- Punto luminoso in alto a destra scontrino -->
    <circle cx="247" cy="91" r="5" fill="url(#accentGrad)" opacity="0.9" filter="url(#softGlow)"></circle>

    <!-- ===== TESTO ===== -->
    <!-- "Forfettario" -->
    <text x="200" y="278" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="-0.5" fill="url(#accentGrad)" filter="url(#softGlow)">Forfettario</text>

    <!-- "App" in bianco -->
    <text x="200" y="278" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="-0.5" fill="#e6edf3" dx="93">App</text>

    <!-- Linea decorativa sotto il testo -->
    <line x1="120" y1="290" x2="280" y2="290" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3"></line>

    <!-- "by Peppone Tek" -->
    <text x="200" y="312" font-family="'Courier New', 'DM Mono', monospace" font-size="13" font-weight="400" text-anchor="middle" letter-spacing="2" fill="#6e7681">by PEPPONE TEK</text>

    <!-- Tre punti decorativi (badge tech) -->
    <circle cx="174" cy="329" r="3" fill="#58a6ff" opacity="0.6"></circle>
    <circle cx="200" cy="329" r="3" fill="url(#accentGrad)" opacity="0.8"></circle>
    <circle cx="226" cy="329" r="3" fill="#3fb950" opacity="0.6"></circle>

  </g>
</svg></svg><style>@media (prefers-color-scheme: light) { :root { filter: none; } }
@media (prefers-color-scheme: dark) { :root { filter: none; } }
</style></svg>